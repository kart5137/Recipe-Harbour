[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-pipeline"
version = "0.1.0"
description = "Recipe Harbour data pipeline: fetch, parse and profile Wikibooks recipes"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "mwparserfromhell==0.7.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff"]

[project.scripts]
rh = "rh_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
